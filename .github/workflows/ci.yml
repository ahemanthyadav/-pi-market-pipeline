# Repo checks from AGENTS.md "Before any push" (review AR-9). Needs no secrets and touches no cluster.
name: ci
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pandas numpy lxml
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Lint (syntax)
        run: |
          fail=0
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f" || fail=1; done
          for f in $(git ls-files '*.sh'); do bash -n "$f" || fail=1; done
          python3 -c "import ast,sys; ast.parse(open('.githooks/pre-commit').read())" || fail=1
          exit $fail
      - name: Lint (ruff fatal set + shellcheck errors)
        # Fatal class only: syntax errors and undefined names (the DQ-3 `failed` bug class).
        # Unused imports (F401) are NOT enforced: they live in scripts baked into deployed images —
        # clean them at each image's next rebuild so the repo never drifts from the live code.
        run: |
          pip install ruff==0.17.1 shellcheck-py==0.11.0.1
          ruff check --select E9,F63,F7,F82 .
          shellcheck -S error $(git ls-files '*.sh')
      - name: Docs agree with manifests
        run: python3 ops-tools/workloads.py --check
      - name: Unit tests
        run: |
          python3 tests/test_creds.py
          python3 tests/test_index_fetchers.py
          python3 tests/test_stocks.py
          python3 tests/test_multiuser.py
          python3 tests/test_stock_fundamentals_fixes.py
          python3 tests/test_stock_prices.py
          python3 tests/test_pull_backups.py
          python3 tests/test_financial_facts.py
          python3 tests/test_ev0.py
          python3 tests/test_manifest_safeguards.py
          python3 tests/test_nse_fundamentals.py
      - name: Shell tests
        run: |
          bash tests/test-precommit-hook.sh
          bash tests/test-nodewatch.sh
          bash tests/test-pg-backup.sh   # skips itself when no real dump is present
      - name: Manifests parse as Kubernetes objects
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path("manifests").rglob("*.yaml")):
              for d in yaml.safe_load_all(p.read_text()):
                  if isinstance(d, dict) and not (d.get("kind") and d.get("metadata", {}).get("name")):
                      print("missing kind/metadata.name:", p); bad = 1
          sys.exit(bad)
          PY
      - name: Secret scan (full history)
        run: gitleaks git --redact --no-banner
