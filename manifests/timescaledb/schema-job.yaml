# One-shot schema bootstrap. Waits for the DB (pg_isready loop), then applies
# /schema/01-schema.sql with ON_ERROR_STOP. Safe to re-run (all DDL is
# IF NOT EXISTS). Uses the same TimescaleDB image for matching psql client.
# Runs on any Ready Pi worker (no node pinning needed).
apiVersion: batch/v1
kind: Job
metadata:
  name: timescaledb-schema
  namespace: market-data
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema
          image: timescale/timescaledb:2.30.1-pg16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                pg_isready -h timescaledb -U postgres && break
                echo "waiting for timescaledb ($i/60)"
                sleep 5
              done
              for f in $(ls /schema/*.sql | sort); do
                echo "== applying $f"
                psql -h timescaledb -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
              done
              echo SCHEMA-OK
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: timescaledb-schema
