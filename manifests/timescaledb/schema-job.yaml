# One-shot schema bootstrap. Waits for the DB (pg_isready loop), then applies
# every /schema/*.sql in sorted order (01-schema … 13-*, including the 06x
# interleaves) with ON_ERROR_STOP. Safe to re-run (all DDL is IF NOT EXISTS /
# CREATE OR REPLACE). Uses the same TimescaleDB image for matching psql client.
# Runs on any Ready Pi worker (no node pinning needed).
apiVersion: batch/v1
kind: Job
metadata:
  name: timescaledb-schema
  namespace: market-data
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: schema
          image: timescale/timescaledb:2.30.1-pg16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                pg_isready -h timescaledb -U postgres && break
                echo "waiting for timescaledb ($i/60)"
                sleep 5
              done
              # ADR 0032: bookkeeping — every applied key is recorded with its
              # md5, so drift (an OLD key edited after application) is visible.
              # Keys stay idempotent and are still reapplied wholesale.
              psql -h timescaledb -U postgres -d postgres -v ON_ERROR_STOP=1 -c "
                CREATE TABLE IF NOT EXISTS schema_migrations (
                  filename TEXT PRIMARY KEY, md5 TEXT NOT NULL,
                  first_applied TIMESTAMPTZ NOT NULL DEFAULT now(),
                  last_applied  TIMESTAMPTZ NOT NULL DEFAULT now())"
              for f in $(ls /schema/*.sql | sort); do
                echo "== applying $f"
                psql -h timescaledb -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
                sum=$(md5sum "$f" | cut -d' ' -f1)
                base=$(basename "$f")
                prev=$(psql -h timescaledb -U postgres -d postgres -At \
                  -c "SELECT md5 FROM schema_migrations WHERE filename='$base'")
                if [ -n "$prev" ] && [ "$prev" != "$sum" ]; then
                  echo "WARN $base changed after first application (md5 $prev -> $sum)"
                fi
                psql -h timescaledb -U postgres -d postgres -v ON_ERROR_STOP=1 -c "
                  INSERT INTO schema_migrations (filename, md5) VALUES ('$base', '$sum')
                  ON CONFLICT (filename) DO UPDATE
                  SET last_applied = now(), md5 = EXCLUDED.md5"
              done
              echo SCHEMA-OK
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: timescaledb-schema
