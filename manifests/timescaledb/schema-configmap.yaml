  17-sector-metrics.sql: |
    -- Daily sector aggregates (ADR 0026): one row per (universe, sector, day),
    -- written by valuation.py right after stock_valuations. Medians are over
    -- sane positive values; returns are equal-weighted means of members.
    CREATE TABLE IF NOT EXISTS sector_metrics (
      universe          TEXT NOT NULL,
      sector            TEXT NOT NULL,
      ts                TIMESTAMPTZ NOT NULL,
      members           INT NOT NULL,
      median_pe         DOUBLE PRECISION,
      median_pb         DOUBLE PRECISION,
      median_ev_ebitda  DOUBLE PRECISION,
      median_roe        DOUBLE PRECISION,
      median_op_margin  DOUBLE PRECISION,
      avg_ret_6m        DOUBLE PRECISION,
      avg_ret_12m       DOUBLE PRECISION,
      median_upside_pct DOUBLE PRECISION,  -- from today's stock_valuations
      PRIMARY KEY (universe, sector, ts)
    );
    SELECT create_hypertable('sector_metrics', 'ts', if_not_exists => TRUE);
    SELECT set_chunk_time_interval('sector_metrics', INTERVAL '365 days');
