    CREATE TABLE IF NOT EXISTS metric_relevance (
      style  TEXT NOT NULL,
      metric TEXT NOT NULL,               -- stock_fundamentals metric name
      weight SMALLINT NOT NULL CHECK (weight BETWEEN 0 AND 3),
