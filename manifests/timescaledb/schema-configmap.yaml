# Pipeline schema, Phase 2 step 3. Applied by schema-job.yaml (idempotent —
# every statement is IF NOT EXISTS, so re-running is always safe).
# One hypertable per time-series category; raw_headlines is a plain staging table.
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-schema
  namespace: market-data
data:
  01-schema.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb;

    CREATE TABLE IF NOT EXISTS index_prices (
      ticker TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      open DOUBLE PRECISION,
      high DOUBLE PRECISION,
      low DOUBLE PRECISION,
      close DOUBLE PRECISION,
      volume BIGINT
    );
    SELECT create_hypertable('index_prices', 'ts', if_not_exists => TRUE);
    -- 2026-10-10: one-year chunks for everything created from now on (the table is
    -- ~10k rows a year). Needed for the 40-year index backfill: at the default
    -- 7 days it would have added ~1,900 chunks, and the unbounded scans in
    -- ta-compute / pipeline-health lock every chunk. Chunks that already exist
    -- (2021-10 → 2026-10, weekly) are not rewritten. Idempotent.
    SELECT set_chunk_time_interval('index_prices', INTERVAL '365 days');

    CREATE TABLE IF NOT EXISTS fx_rates (
      pair TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      rate DOUBLE PRECISION
    );
    SELECT create_hypertable('fx_rates', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS commodity_prices (
      commodity TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      price DOUBLE PRECISION
    );
    SELECT create_hypertable('commodity_prices', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS bond_yields (
      instrument TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      yield DOUBLE PRECISION
    );
    SELECT create_hypertable('bond_yields', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS interest_rates (
      rate_name TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      value DOUBLE PRECISION
    );
    SELECT create_hypertable('interest_rates', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS news_sentiment (
      headline TEXT NOT NULL,
      source TEXT,
      ts TIMESTAMPTZ NOT NULL,
      sentiment_score DOUBLE PRECISION,
      ticker_relevance TEXT
    );
    SELECT create_hypertable('news_sentiment', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS technical_indicators (
      ticker TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      indicator_name TEXT NOT NULL,
      value DOUBLE PRECISION
    );
    SELECT create_hypertable('technical_indicators', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS capital_flows (
      flow_type TEXT NOT NULL,
      direction TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      amount DOUBLE PRECISION,
      segment TEXT
    );
    SELECT create_hypertable('capital_flows', 'ts', if_not_exists => TRUE);

    CREATE TABLE IF NOT EXISTS raw_headlines (
      id BIGSERIAL PRIMARY KEY,
      headline TEXT NOT NULL,
      source TEXT,
      ts TIMESTAMPTZ NOT NULL DEFAULT now(),
      scored BOOLEAN NOT NULL DEFAULT FALSE
    );
  02-constraints.sql: |
    -- Unique indexes on natural keys (roadmap §3.3, applied 2026-10-03).
    -- Every index includes the hypertable partition column (ts), as required.
    -- Writers verified as row-level DELETE+INSERT (architecture doc §1), so
    -- these only fire on genuine duplicates. Verified 0 pre-existing dups.
    -- news_sentiment + raw_headlines intentionally EXCLUDED: INSERT-only
    -- writers — a constraint there would turn benign crash-recovery reruns
    -- into job failures until the scorers get ON CONFLICT clauses.
    CREATE UNIQUE INDEX IF NOT EXISTS ux_index_prices_ticker_ts
      ON index_prices (ticker, ts);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_fx_rates_pair_ts
      ON fx_rates (pair, ts);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_commodity_prices_key
      ON commodity_prices (commodity, ts);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_bond_yields_instrument_ts
      ON bond_yields (instrument, ts);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_interest_rates_name_ts
      ON interest_rates (rate_name, ts);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_ta_ticker_ts_indicator
      ON technical_indicators (ticker, ts, indicator_name);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_capital_flows_key
      ON capital_flows (flow_type, segment, ts);
  03-heartbeat.sql: |
    -- Pipeline health heartbeat (roadmap §3.1). v1 semantics: one row per
    -- FEED, written by the pipeline-health CronJob (01:45 UTC) from data-
    -- freshness checks — detects missed jobs, stale feeds, dead sources.
    -- v2 (per-JOB last_ok from inside each fetcher) lands with the next
    -- fetcher image rebuilds. Plain table (tiny, no hypertable overhead).
    CREATE TABLE IF NOT EXISTS pipeline_heartbeat (
      feed TEXT PRIMARY KEY,
      last_check TIMESTAMPTZ NOT NULL DEFAULT now(),
      last_data_ts TIMESTAMPTZ,
      fresh BOOLEAN NOT NULL DEFAULT FALSE,
      rows_total BIGINT NOT NULL DEFAULT 0,
      max_age_hours INT NOT NULL DEFAULT 96
    );
  04-intraday.sql: |
    -- Intraday store for fast-moving instruments (2026-10-03): hourly
    -- candles for gold/silver/oil futures + DXY. Deliberately SEPARATE from
    -- index_prices — ta-compute iterates every index_prices ticker over
    -- all rows, so hourly rows there would corrupt daily RSI/MACD math.
    -- FX intraday goes to fx_rates instead (nothing computes over it).
    CREATE TABLE IF NOT EXISTS intraday_prices (
      ticker TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      open DOUBLE PRECISION,
      high DOUBLE PRECISION,
      low DOUBLE PRECISION,
      close DOUBLE PRECISION,
      volume BIGINT
    );
    SELECT create_hypertable('intraday_prices', 'ts', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_intraday_prices_ticker_ts
      ON intraday_prices (ticker, ts);
  05-ticker-names.sql: |
    -- Human-readable names next to tickers (2026-10-03). Reference table for
    -- dashboards (Indices variable shows "Nifty 50 (^NSEI)" style labels)
    -- and ad-hoc queries. ON CONFLICT DO UPDATE => re-runs refresh names.
    CREATE TABLE IF NOT EXISTS ticker_names (
      ticker TEXT PRIMARY KEY,
      name TEXT NOT NULL
    );
    INSERT INTO ticker_names (ticker, name) VALUES
      ('^GSPC','S&P 500'), ('^IXIC','Nasdaq Composite'), ('^DJI','Dow Jones'),
      ('^RUT','Russell 2000'), ('^RUI','Russell 1000'), ('^VIX','VIX (US)'),
      ('^FTSE','FTSE 100'), ('^GDAXI','DAX 40'), ('^FCHI','CAC 40'),
      ('^STOXX50E','Euro Stoxx 50'), ('^IBEX','IBEX 35'), ('FTSEMIB.MI','FTSE MIB'),
      ('^SSMI','Swiss Market Index'), ('^AEX','AEX'),
      ('^N225','Nikkei 225'), ('^HSI','Hang Seng'), ('000001.SS','Shanghai Composite'),
      ('399001.SZ','Shenzhen Component'), ('^KS11','KOSPI'), ('^TWII','TAIEX'),
      ('^AXJO','ASX 200'), ('^STI','Straits Times Index'),
      ('^GSPTSE','S&P/TSX Composite'), ('^BVSP','Bovespa'), ('^MXX','IPC Mexico'),
      ('DX-Y.NYB','US Dollar Index (DXY)'),
      ('GC=F','Gold Futures'), ('SI=F','Silver Futures'), ('CL=F','WTI Crude Oil Futures'),
      ('^NSEI','Nifty 50'), ('^NSEBANK','Nifty Bank'), ('^CNXIT','Nifty IT'),
      ('^CNXPHARMA','Nifty Pharma'), ('NIFTYMIDCAP150.NS','Nifty Midcap 150'),
      ('NIFTYSMLCAP250.NS','Nifty Smallcap 250'), ('^CRSLDX','Nifty 500'),
      ('^BSESN','Sensex'),
      ('^INDIAVIX','India VIX'),
      ('USDINR=X','US Dollar / Indian Rupee'), ('EURUSD=X','Euro / US Dollar'),
      ('GBPUSD=X','British Pound / US Dollar'), ('USDJPY=X','US Dollar / Japanese Yen'),
      ('AUDUSD=X','Australian Dollar / US Dollar'), ('USDCHF=X','US Dollar / Swiss Franc'),
      ('USDCNY=X','US Dollar / Chinese Yuan'), ('EURINR=X','Euro / Indian Rupee'),
      ('GBPINR=X','British Pound / Indian Rupee'), ('JPYINR=X','Japanese Yen / Indian Rupee')
    ON CONFLICT (ticker) DO UPDATE SET name = EXCLUDED.name;
  06-stock-screener.sql: |
    -- Stock screener layer v1 (2026-10-03, stock-screener-implementation-plan.md
    -- Phase A). All tables NEW — nothing existing is touched. Security-master
    -- fields + point-in-time filing_published_at adopted from the target
    -- architecture doc; max-history design (no year cap).
    CREATE TABLE IF NOT EXISTS universe_constituents (
      universe   TEXT NOT NULL,            -- 'SP500' | 'NIFTY500'
      symbol     TEXT NOT NULL,            -- Yahoo symbol (NSE = SYMBOL.NS)
      name       TEXT NOT NULL,
      sector     TEXT,
      isin       TEXT,
      cik        TEXT,                     -- zero-padded SEC CIK (S&P 500 only)
      exchange   TEXT,
      currency   TEXT,
      active     BOOLEAN NOT NULL DEFAULT TRUE,
      first_seen TIMESTAMPTZ NOT NULL DEFAULT now(),
      last_seen  TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (universe, symbol)
    );

    -- Max-history daily OHLCV (US veterans 25-35y; ~4-6M rows ≈ ~1 GB in 30 GiB PV)
    CREATE TABLE IF NOT EXISTS stock_prices (
      symbol TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      open DOUBLE PRECISION,
      high DOUBLE PRECISION,
      low DOUBLE PRECISION,
      close DOUBLE PRECISION,
      volume BIGINT
    );
    SELECT create_hypertable('stock_prices', 'ts', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_stock_prices_symbol_ts
      ON stock_prices (symbol, ts);

    -- Fundamentals: long/narrow, source-tagged, point-in-time.
    -- ts = period END (statements) or fetch date (live ratios);
    -- filing_published_at = when the fact first became knowable
    -- (EDGAR 'filed'; yfinance legs = fetch date — our DB couldn't know earlier).
    -- Deliberately plain table: revisions for this table keep last-write-wins
    -- per (symbol, period, metric, source); append-only provenance is v2.
    CREATE TABLE IF NOT EXISTS stock_fundamentals (
      symbol TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      metric TEXT NOT NULL,
      value DOUBLE PRECISION,
      source TEXT NOT NULL DEFAULT 'yfinance',
      filing_published_at TIMESTAMPTZ,
      PRIMARY KEY (symbol, ts, metric, source)
    );

    -- Price-derived daily metrics (ret_xm, vol, drawdown, 52w position, SMAs)
    CREATE TABLE IF NOT EXISTS stock_metrics_daily (
      symbol TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      metric TEXT NOT NULL,
      value DOUBLE PRECISION
    );
    SELECT create_hypertable('stock_metrics_daily', 'ts', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS ux_stock_metrics_symbol_ts_metric
      ON stock_metrics_daily (symbol, ts, metric);

    -- Daily factor + composite scores (balanced screen, plan §7)
    CREATE TABLE IF NOT EXISTS stock_scores (
      symbol TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      universe TEXT NOT NULL,
      value_score DOUBLE PRECISION,
      quality_score DOUBLE PRECISION,
      growth_score DOUBLE PRECISION,
      momentum_score DOUBLE PRECISION,
      risk_score DOUBLE PRECISION,
      composite DOUBLE PRECISION,
      rank INT,
      coverage DOUBLE PRECISION,
      eligible BOOLEAN NOT NULL DEFAULT TRUE,
      PRIMARY KEY (symbol, ts)
    );
    SELECT create_hypertable('stock_scores', 'ts', if_not_exists => TRUE);

    -- Shortlist reports (markdown; '__digest__' = combined daily digest)
    CREATE TABLE IF NOT EXISTS stock_reports (
      symbol TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      report_md TEXT NOT NULL,
      PRIMARY KEY (symbol, ts)
    );

    -- Screener run log + resumable cursor for long fetches
    CREATE TABLE IF NOT EXISTS screening_runs (
      ts TIMESTAMPTZ NOT NULL,
      universe TEXT NOT NULL,
      n_scored INT,
      n_eligible INT,
      n_shortlisted INT,
      params_hash TEXT,
      PRIMARY KEY (ts, universe)
    );
    CREATE TABLE IF NOT EXISTS job_state (
      job_name TEXT PRIMARY KEY,
      last_key TEXT,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  06b-corporate-actions.sql: |
    -- DQ-1 (2026-10-17): adjusted close + corporate actions tracking.
    -- Yahoo's raw Close is split-adjusted but NOT dividend-adjusted; Adj Close is both.
    -- stock_prices previously dropped Adj Close; now we store it for correct returns.
    ALTER TABLE IF EXISTS stock_prices ADD COLUMN IF NOT EXISTS adj_close DOUBLE PRECISION;

    -- Corporate actions log: splits, spin-offs, bonuses, dividends.
    -- One row per action per symbol; used to detect when backfilled history
    -- needs re-scaling (DQ-1 fix: re-backfill when Stock Splits != 0 in refresh window).
    CREATE TABLE IF NOT EXISTS corporate_actions (
      symbol TEXT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,            -- action / ex-date
      action_type TEXT NOT NULL,          -- 'split' | 'spinoff' | 'bonus' | 'dividend'
      ratio DOUBLE PRECISION,             -- split/spin-off ratio (e.g. 6.66 for 1:6.66)
      amount DOUBLE PRECISION,            -- dividend / bonus amount per share
      source TEXT NOT NULL DEFAULT 'yfinance',
      PRIMARY KEY (symbol, ts, action_type)
    );
  06c-data-foundations.sql: |
    -- DQ-2 / G-1 / EV-1 / EV-2 (2026-10-17): data foundations schema (additive, idempotent).
    -- See docs/data-foundations-schema-draft-2026-10-10.md §2.

    -- Point-in-time fundamentals: one row per (period, filing) only when value differs
    -- from previous filing (first release + genuine restatements). Replaces nothing;
    -- stock_fundamentals stays as the "latest" view.
    CREATE TABLE IF NOT EXISTS financial_facts (
      symbol        TEXT NOT NULL,
      source        TEXT NOT NULL,                -- 'edgar' | 'yfinance'
      metric        TEXT NOT NULL,
      period_end    DATE NOT NULL,
      period_start  DATE,                         -- NULL for balance-sheet (instant) facts
      duration_days INT,                          -- ~91 / 182 / 273 / 365; NULL = instant
      value         DOUBLE PRECISION NOT NULL,
      filed         DATE NOT NULL,                -- EDGAR 'filed'; yfinance = first date WE observed it
      form          TEXT,                         -- '10-K' | '10-Q' | NULL
      accession     TEXT,                         -- EDGAR accn, provenance
      observed_at   TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (symbol, source, metric, period_end, duration_days, filed)
    );
    CREATE INDEX IF NOT EXISTS idx_financial_facts_pit
      ON financial_facts (symbol, metric, period_end, duration_days, filed);

    -- Weekly universe membership snapshot (EV-1): append-only, one row per
    -- (universe, snapshot_date, symbol) — never overwritten.
    CREATE TABLE IF NOT EXISTS universe_membership_snapshots (
      universe      TEXT NOT NULL,            -- 'SP500' | 'NIFTY500'
      snapshot_date DATE NOT NULL,
      symbol        TEXT NOT NULL,
      sector        TEXT,
      PRIMARY KEY (universe, snapshot_date, symbol)
    );

    -- Price anomalies: jumps >40%, history restatements, bad bars (G-1).
    -- Written by stock_prices.py daily pull; reviewed before EV-0 backtests.
    CREATE TABLE IF NOT EXISTS price_anomalies (
      symbol      TEXT NOT NULL,
      ts          TIMESTAMPTZ NOT NULL,
      kind        TEXT NOT NULL,                  -- 'jump_gt_40pct' | 'history_restated' | 'bad_bar'
      detail      TEXT,
      ret         DOUBLE PRECISION,
      status      TEXT NOT NULL DEFAULT 'open',   -- 'open' | 'explained' | 'refetched'
      detected_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (symbol, ts, kind)
    );

    -- Standard factor returns (EV-9/P1): Ken French (US) / IIM-A (India).
    -- Loaded by a separate fetcher; reader changes come later.
    CREATE TABLE IF NOT EXISTS factor_returns (
      market  TEXT NOT NULL,                      -- 'US' | 'IN'
      factor  TEXT NOT NULL,                      -- 'MKT_RF' | 'SMB' | 'HML' | 'RMW' | 'CMA' | 'MOM' | 'RF'
      ts      DATE NOT NULL,                      -- month end or day
      freq    TEXT NOT NULL,                      -- 'M' | 'D'
      value   DOUBLE PRECISION NOT NULL,          -- percent, as published
      source  TEXT NOT NULL,
      PRIMARY KEY (market, factor, freq, ts)
    );
  06d-job-runs.sql: |
    -- AR-3 (2026-10-17): durable job run record. One row per job execution:
    -- start/end timestamps, rows written, status, error text. Plain table
    -- (small, append-only) — survives pod eviction, unlike k8s Job status.
    CREATE TABLE IF NOT EXISTS job_runs (
      job_name    TEXT NOT NULL,
      started_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
      ended_at    TIMESTAMPTZ,
      rows_written BIGINT NOT NULL DEFAULT 0,
      status      TEXT NOT NULL DEFAULT 'running',   -- 'running' | 'ok' | 'fail'
      error       TEXT,
      PRIMARY KEY (job_name, started_at)
    );
  06e-chunk-intervals.sql: |
    -- 2026-10-18: stock_prices had 3,382 seven-day chunks (data back to 1961) -> 34 s
    -- query PLANNING for any open-ended per-symbol read. New chunks are one year; the
    -- existing weekly chunks for 1962-2025 were merged per year with merge_chunks()
    -- (ops-tools/sql/2026-10-18-merge-weekly-chunks.sql) -> 107 chunks, 34 ms planning.
    -- Idempotent: only affects chunks created from now on.
    SELECT set_chunk_time_interval('stock_prices', INTERVAL '365 days');
    -- 2026-10-19: the history backfills (H-1..H-5) put decades into tables still on 7-day chunks
    -- (bond_yields 1,921 / fx_rates 1,565 chunks; FRED's DFF from 1954 hit "out of shared memory").
    -- Same fix: 1-year chunks; fx_rates/bond_yields 1990-2025 merged per year (rows + sums identical).
    SELECT set_chunk_time_interval(t, INTERVAL '365 days')
      FROM unnest(ARRAY['fx_rates', 'bond_yields', 'interest_rates', 'technical_indicators', 'stock_metrics_daily']) t;
  07-headline-intelligence.sql: |
    -- Headline entity/event extraction v1 (2026-10-09, findings Tier 1 #2;
    -- ADR 0010). Gazetteer-first: entities are INSTRUMENT-linked matches from
    -- ticker_names (deterministic, no model) — model-based NER is deferred to
    -- the 3090 AI layer. Derived tables, rebuilt by the headline-ner CronJob
    -- via DELETE+INSERT per headline_id (idempotent re-runs). Plain tables:
    -- a few rows/headline/day — pipeline_heartbeat-style "tiny, no hypertable
    -- overhead" reasoning. Additive only; rollback = DROP both tables.
    CREATE TABLE IF NOT EXISTS headline_entities (
      id BIGSERIAL PRIMARY KEY,
      headline_id BIGINT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      symbol TEXT NOT NULL,
      name TEXT NOT NULL,
      entity_type TEXT NOT NULL,        -- 'stock' | 'index' | 'fx'
      universe TEXT,                    -- NIFTY500 | SP500 | NULL
      source TEXT,
      UNIQUE (headline_id, symbol)
    );
    CREATE INDEX IF NOT EXISTS idx_headline_entities_symbol_ts
      ON headline_entities (symbol, ts DESC);

    -- Event rows from a v1 keyword taxonomy (results, rating_action, ma,
    -- buyback, order_win, capex, ipo, dividend, debt_raise, regulatory, legal,
    -- leadership, product, partnership, guidance, rate_decision). Extensible
    -- in headline_ner.py — the taxonomy is code, not schema.
    CREATE TABLE IF NOT EXISTS headline_events (
      id BIGSERIAL PRIMARY KEY,
      headline_id BIGINT NOT NULL,
      ts TIMESTAMPTZ NOT NULL,
      event_type TEXT NOT NULL,
      symbol TEXT,                      -- the company when exactly one is mentioned
      source TEXT,
      UNIQUE (headline_id, event_type, symbol)
    );
    CREATE INDEX IF NOT EXISTS idx_headline_events_type_ts
      ON headline_events (event_type, ts DESC);
  08-watchlist.sql: |
    -- Watchlist / holdings (2026-10-10). Plain table, single user. The ONLY
    -- writer is the Telegram listener's /watch command (manifests/telegram/
    -- bot.py); digest.py and alerts.py read it. qty + avg_cost NULL = watch
    -- only; avg_cost is per share in the stock's own currency.
    CREATE TABLE IF NOT EXISTS watchlist (
      symbol TEXT PRIMARY KEY,          -- universe_constituents.symbol form (TCS.NS, AAPL)
      qty DOUBLE PRECISION,
      avg_cost DOUBLE PRECISION,
      note TEXT,
      added_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  09-multiuser.sql: |
    -- Multi-user Telegram bot (2026-10-12, ADR 0012). Every user owns a private watchlist;
    -- access is a table, not a Secret edit. The OWNER is the Secret's chat id and is NOT a row
    -- here (always allowed). Idempotent; refuses to guess an owner if the watchlist has data.
    CREATE TABLE IF NOT EXISTS bot_users (
      chat_id TEXT PRIMARY KEY,         -- Telegram chat id (negative for groups)
      name TEXT NOT NULL,
      active BOOLEAN NOT NULL DEFAULT true,
      added_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      added_by TEXT
    );
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                     WHERE table_schema = 'public' AND table_name = 'watchlist'
                       AND column_name = 'chat_id') THEN
        IF EXISTS (SELECT 1 FROM watchlist) THEN
          RAISE EXCEPTION 'watchlist has rows but no chat_id: assign them to the owner first (ADR 0012)';
        END IF;
        ALTER TABLE watchlist DROP CONSTRAINT IF EXISTS watchlist_pkey;
        ALTER TABLE watchlist ADD COLUMN chat_id TEXT NOT NULL;
        ALTER TABLE watchlist ADD PRIMARY KEY (chat_id, symbol);
      END IF;
    END $$;
  10-roles.sql: |
    -- AR-8 (2026-10-18): least-privilege roles for the readers exposed on the tailnet.
    -- Created NOLOGIN here (no secret in git); LOGIN + password are set out-of-band from
    -- the Secrets grafana-db-ro / telegram-db (ops manual §10). Idempotent.
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'grafana_ro') THEN
        CREATE ROLE grafana_ro NOLOGIN;
      END IF;
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'telegram_app') THEN
        CREATE ROLE telegram_app NOLOGIN;
      END IF;
    END $$;
    GRANT CONNECT ON DATABASE postgres TO grafana_ro, telegram_app;
    GRANT USAGE ON SCHEMA public TO grafana_ro, telegram_app;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana_ro, telegram_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
      GRANT SELECT ON TABLES TO grafana_ro, telegram_app;
    -- Grafana never writes: every session is read-only even if a panel tried.
    ALTER ROLE grafana_ro SET default_transaction_read_only = on;
    -- The bot's only writes (bot.py /watch, users.py /adduser /rmuser).
    GRANT INSERT, UPDATE, DELETE ON watchlist, bot_users TO telegram_app;
  11-news-constraints.sql: |
    -- 2026-10-18 (roadmap §3.4): the last two tables without a DB-level dedup guard.
    -- Keys mirror the writers exactly: news-fetcher skips (headline, source, UTC day);
    -- the scorer writes each staged row once, inserts + `scored` flag in ONE transaction,
    -- so a crash leaves nothing half-done and a re-run can never hit these indexes.
    -- md5(headline): no btree size limit on long headlines. Verified 0 conflicts first.
    -- Republished articles (same headline on a later day) remain separate rows on purpose.
    CREATE UNIQUE INDEX IF NOT EXISTS ux_raw_headlines_key
      ON raw_headlines (md5(headline), source, ((ts AT TIME ZONE 'UTC')::date));
    CREATE UNIQUE INDEX IF NOT EXISTS ux_news_sentiment_key
      ON news_sentiment (md5(headline), source, ts);
  12-llm.sql: |
    -- ML-7a (2026-10-18, ADR 0022): LLM narratives produced through the shared llm-gateway.
    -- One row per (IST day, kind); DELETE+INSERT by manifests/llm/narrative.py. The digest shows
    -- `summary` only when status = 'ok' (every number checked against `facts`). Never a scoring input.
    CREATE TABLE IF NOT EXISTS llm_narratives (
      ts         DATE NOT NULL,
      kind       TEXT NOT NULL,                 -- 'daily_market' (ML-7b/7c add kinds)
      status     TEXT NOT NULL,                 -- ok | invalid | unavailable
      summary    TEXT,
      model      TEXT,                          -- which model actually answered (gateway response)
      attempts   INT NOT NULL DEFAULT 0,
      detail     TEXT,
      facts      JSONB,                         -- the exact input the model saw
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (ts, kind)
    );
  13-news-embeddings.sql: |
    -- ML-2 groundwork (2026-10-19, ADR 0024): headline embeddings from the shared llm-gateway (`embed`).
    -- One row per raw_headlines.id; `model` = the exact embedding model (vectors are only ever compared within
    -- one model). story_id = headline_id of the first headline of its story (manifests/llm/news_embed.py).
    -- Plain table, exact search (~90 headlines/day; no ANN index needed — pgvector HNSW caps at 2000 dims).
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE TABLE IF NOT EXISTS headline_embeddings (
      headline_id BIGINT PRIMARY KEY,
      ts          TIMESTAMPTZ NOT NULL,
      model       TEXT NOT NULL,
      embedding   vector(2048) NOT NULL,
      story_id    BIGINT,
      created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_headline_embeddings_ts ON headline_embeddings (ts DESC);
    CREATE INDEX IF NOT EXISTS idx_headline_embeddings_story ON headline_embeddings (story_id);
  14-index-membership.sql: |
    -- EV-1 (2026-10-26, ADR 0025): point-in-time index membership intervals,
    -- reconstructed from public change histories (membership_history.py).
    -- removed IS NULL = currently a member. added = 1900-01-01 means "member
    -- since before the source's records" (clip backtests to covered windows).
    CREATE TABLE IF NOT EXISTS index_membership (
      universe TEXT NOT NULL,              -- 'SP500' ('NIFTY500' when a source lands)
      symbol   TEXT NOT NULL,              -- universe_constituents.symbol form
      added    DATE NOT NULL,
      removed  DATE,                       -- NULL = still in the index
      source   TEXT NOT NULL,              -- 'wikipedia'
      PRIMARY KEY (universe, symbol, added)
    );
    -- Point-in-time lookup: members of a universe on a given day.
    CREATE INDEX IF NOT EXISTS ix_index_membership_window
      ON index_membership (universe, added, removed);
  15-stock-valuations.sql: |
    -- Deterministic intrinsic-value estimates for EVERY active symbol
    -- (ADR 0026, 2026-10-26): the famous methods, each NULL when its inputs
    -- don't apply (losses, no dividend, ROE below the discount rate, ...).
    -- fair_value = median of the methods that produced a number. Assumptions
    -- (ERP 4.5%, terminal growth 2.5%, growth clamps, 25% tax in EPV, EPV
    -- carries no cash credit) are pinned in ADR 0026. Purely DESCRIPTIVE:
    -- never feeds stock_scores/composite without an EV-0 pass.
    CREATE TABLE IF NOT EXISTS stock_valuations (
      symbol          TEXT NOT NULL,
      ts              TIMESTAMPTZ NOT NULL,     -- valuation date 00:00 UTC
      universe        TEXT NOT NULL,
      close           DOUBLE PRECISION NOT NULL,
      graham          DOUBLE PRECISION,  -- sqrt(22.5 * EPS * BVPS)
      peer_multiple   DOUBLE PRECISION,  -- sector-median P/E x EPS (P/B x BVPS where P/E misleads)
      fcf_yield       DOUBLE PRECISION,  -- FCF/share / r (perpetuity, no growth)
      dcf             DOUBLE PRECISION,  -- 2-stage FCF DCF: 5y at clamped CAGR, terminal 2.5%
      ddm             DOUBLE PRECISION,  -- Gordon growth on dividends/share
      epv             DOUBLE PRECISION,  -- Greenwald: norm. EBIT x (1-25%) / r - debt, per share
      residual_income DOUBLE PRECISION,  -- justified P/B: (ROE-g)/(r-g) x BVPS
      peg_lynch       DOUBLE PRECISION,  -- PEG=1: EPS x 100 x clamped EPS CAGR
      fair_value      DOUBLE PRECISION,  -- median of the available methods
      upside_pct      DOUBLE PRECISION,
      methods         INT NOT NULL,
      discount_rate   DOUBLE PRECISION,  -- (10y + ERP), decimal
      growth_used     DOUBLE PRECISION,  -- clamped revenue CAGR fed to the DCF, decimal
      PRIMARY KEY (symbol, ts)
    );
    SELECT create_hypertable('stock_valuations', 'ts', if_not_exists => TRUE);
    SELECT set_chunk_time_interval('stock_valuations', INTERVAL '365 days');

  16-metric-relevance.sql: |
    -- Which metrics matter per sector (ADR 0026, 2026-10-26). Two normalized
    -- tables: every universe_constituents.sector maps to a STYLE, each style
    -- carries metric weights: 3 primary / 2 secondary / 1 context /
    -- 0 actively misleading (with the reason). Consumed by valuation.py
    -- (method selection), stock_report.py and the bot's /stock card.
    -- Curated seed — edit HERE and re-apply (upserts), never ad hoc.
    CREATE TABLE IF NOT EXISTS sector_styles (
      sector TEXT PRIMARY KEY,            -- exact universe_constituents.sector value
      style  TEXT NOT NULL,               -- shared lens across both taxonomies
      cyclical BOOLEAN NOT NULL,
      note   TEXT NOT NULL
