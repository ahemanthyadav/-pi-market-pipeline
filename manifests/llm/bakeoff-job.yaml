# One-shot LLM bake-off for ML-7a (llm-gateway ADR 0002). Writes nothing; read the log.
# Needs a temporary key:  SECRET_NAME=llm-bakeoff-key DURATION=3h \
#   ../llm-gateway/ops/new-project.sh marketdata-bakeoff market-data fast-json,fast-json.2,fast-json.3,general,general.2 20 0
# Then: ops-tools/apply-llm.sh && kubectl apply -f manifests/llm/bakeoff-job.yaml ; logs -> RANKING / BAKEOFF-JSON
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-bakeoff
  namespace: market-data
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bakeoff
          image: local/pipeline-health:v6
          imagePullPolicy: Never
          command: ["python", "/scripts/bakeoff.py"]
          env:
            - {name: PYTHONPATH, value: /scripts}
            - {name: PGHOST, value: timescaledb.market-data.svc.cluster.local}
            - {name: PGUSER, value: postgres}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: timescaledb-auth, key: password}}}
            - {name: PGDATABASE, value: postgres}
            - {name: LLM_BASE_URL, valueFrom: {secretKeyRef: {name: llm-bakeoff-key, key: base-url}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: llm-bakeoff-key, key: api-key}}}
            - {name: CANDIDATES, value: "fast-json,fast-json.2,fast-json.3,general,general.2"}
            - {name: DAYS, value: "10"}
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 256Mi, cpu: 250m}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
      volumes:
        - name: script
          configMap: {name: llm-narrative-script}
