# Daily pg_dump backup (Phase 8). 01:30 UTC, after all compute lands.
# Pinned to pi3 (nodeSelector): reuses the cached timescale image (no new pull)
# and writes dumps to pi3's USB SSD at /var/lib/market-data/backups (hostPath,
# created on first run). Keeps 7 daily dumps, prunes older. Custom format
# (-Fc) + restore with pg_restore. DB itself lives on the TX2's sda4, so this
# is a true second copy on independent hardware.
# 2026-10-11 (review AR-11): dump to a temp name, verify (size floor = half the
# previous dump, readable TOC, index_prices data present), atomic mv + .sha256
# sidecar, prune only readable dumps beyond the newest 7 (empty files always
# removed). Tested by tests/test-pg-backup.sh. Applied + canaried 2026-10-11.
# Also dumps the llm-gateway's `litellm` DB (best effort, 2026-10-19) as litellm-<date>.dump.
# Restore drill (from any pod with the image + Secret):
#   pg_restore -h timescaledb -U postgres -d postgres -c /backups/<file>.dump
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: market-data
spec:
  schedule: "30 1 * * *"
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: pi3
          containers:
            - name: backup
              image: timescale/timescaledb:2.30.1-pg16
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-auth
                      key: password
              command:
                - sh
                - -c
                - |
                  set -eu
                  mkdir -p /backups
                  cd /backups
                  FILE=marketdata-$(date -u +%F).dump
                  TMP=.$FILE.tmp
                  trap 'rm -f "$TMP" /tmp/toc' EXIT
                  fail() { echo "BACKUP-FAIL: $*"; exit 1; }

                  pg_dump -h timescaledb -U postgres -d postgres -Fc -f "$TMP"

                  # verify BEFORE the dump takes its final name
                  SIZE=$(wc -c < "$TMP")
                  PREV=0
                  for f in $(ls -t marketdata-*.dump 2>/dev/null); do
                    if [ -s "$f" ]; then PREV=$(wc -c < "$f"); break; fi
                  done
                  FLOOR=$((PREV / 2))
                  [ "$FLOOR" -ge 102400 ] || FLOOR=102400
                  [ "$SIZE" -ge "$FLOOR" ] || fail "size $SIZE below floor $FLOOR"
                  pg_restore -l "$TMP" > /tmp/toc || fail "pg_restore -l cannot read the dump"
                  ENTRIES=$(grep -vc '^;' /tmp/toc || true)
                  [ "$ENTRIES" -ge 100 ] || fail "only $ENTRIES TOC entries"
                  grep -q 'TABLE DATA public index_prices ' /tmp/toc || fail "index_prices data missing"

                  HASH=$(sha256sum "$TMP" | cut -d' ' -f1)
                  mv "$TMP" "$FILE"
                  echo "$HASH  $FILE" > "$FILE.sha256"

                  # prune: empty files always go; readable dumps beyond the newest 7 go;
                  # unreadable non-empty files are kept and reported, never counted
                  N=0
                  for f in $(ls -t marketdata-*.dump); do
                    if [ ! -s "$f" ]; then rm -f "$f" "$f.sha256"; continue; fi
                    if ! pg_restore -l "$f" > /dev/null 2>&1; then echo "WARN: unreadable $f kept"; continue; fi
                    N=$((N + 1))
                    if [ "$N" -gt 7 ]; then rm -f "$f" "$f.sha256"; fi
                  done
                  ls -lh /backups/
                  echo "BACKUP-OK $FILE size=$SIZE entries=$ENTRIES sha256=$HASH"

                  # 2026-10-19: the shared llm-gateway's own DB (keys, budgets, usage — ../llm-gateway).
                  # Best effort: never fails the market-data backup above. Keeps 7.
                  LFILE=litellm-$(date -u +%F).dump
                  if pg_dump -h timescaledb -U postgres -d litellm -Fc -f ".$LFILE.tmp" 2>/dev/null \
                     && pg_restore -l ".$LFILE.tmp" > /dev/null 2>&1; then
                    mv ".$LFILE.tmp" "$LFILE"
                    sha256sum "$LFILE" > "$LFILE.sha256"
                    ls -t litellm-*.dump | tail -n +8 | while read -r f; do rm -f "$f" "$f.sha256"; done
                    echo "LITELLM-BACKUP-OK $LFILE size=$(wc -c < "$LFILE")"
                  else
                    rm -f ".$LFILE.tmp"
                    echo "WARN: litellm DB not backed up (gateway DB missing or unreachable)"
                  fi
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
          volumes:
            - name: backups
              hostPath:
                path: /var/lib/market-data/backups
                type: DirectoryOrCreate
