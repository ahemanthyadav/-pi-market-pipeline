# Two-way Telegram listener — Tier 2 interface (2026-10-09, see
# docs/market-data-telegram-bot.md §4). Always-on getUpdates long-poll;
# CGNAT (F10) makes webhooks impossible, so the bot pulls — outbound only.
#
# The ONLY getUpdates consumer (Telegram 409s a second poller): the digest
# CronJob and Grafana's contact point only sendMessage.
#
# Security: bot.py answers ONLY the allow-listed chat id from the Secret —
# other senders are logged and ignored (bots are publicly discoverable).
# All queries are read-only SELECTs, except /watch add|rm, which writes the
# bot-owned `watchlist` table (2026-10-10).
#
# Pinned pi1: the image is imported there only (roadmap §5 import-burden
# rule). Resources sized for a poll loop that sleeps server-side ~25 s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-bot
  template:
    metadata:
      labels:
        app: telegram-bot
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi1
      automountServiceAccountToken: false   # uses no k8s API
      securityContext:                       # per-image canary (tracker: start with telegram)
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: listener
          image: local/telegram-digest:v26
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["python", "bot.py"]
          # A wedged getUpdates loop used to stay wedged forever (nothing
          # restarts a Deployment on silence). bot.py touches /tmp/bot-alive
          # each poll iteration SINCE THE v24 IMAGE — apply this probe only
          # with (or after) the v23→v24 rebuild, or the pod restart-loops.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/bot-alive')<300 else 1)"
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: BOT_AI_RESOLVE            # forgiving /stock lookup: AI layer on (resolver.py; typed text only)
              value: "1"
            - name: LLM_BASE_URL
              valueFrom: {secretKeyRef: {name: llm-gateway-key, key: base-url}}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: llm-gateway-key, key: api-key}}
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: telegram_app   # AR-8 (Secret telegram-db)
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: telegram-db
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-bot
                  key: chat-id
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
