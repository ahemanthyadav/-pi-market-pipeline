apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-screener
  namespace: market-data
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: screener
              image: local/screener:v16
              imagePullPolicy: Never
              command: ["python", "stock_screener.py"]
              env:
                # DQ-2 (2026-10-18): EDGAR financial_facts first (duration-aware, point-in-time,
                # stale series fall back to yfinance). Rollback = "yfinance". Before/after
                # dry-run diff: SP500 top-50 46/50, NIFTY500 50/50 (pending-tasks DQ-2).
                - name: FUND_SOURCE
                  value: facts
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-auth
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests: {memory: 512Mi, cpu: 250m}
                limits: {memory: 1Gi, cpu: 1}
