---
# G-6 (2026-10-18): India fundamentals from NSE's own results filings -> financial_facts
# (nse_cons / nse_sa, filing-date point-in-time). Weekly incremental: filings already stored are
# skipped, so a normal run only lists ~495 symbols (~3 NSE calls each) plus any new results.
# Sun 10:00 node-local (after universe-refresh 09:00). The first full history = Job
# backfill-nse-fundamentals in backfills.yaml (~19 h, resumable).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nse-fundamentals
  namespace: market-data
spec:
  # Suspended while the first full backfill (Job backfill-nse-fundamentals) runs — both use the
  # same job_state cursor. Un-suspend when that Job logs "cursor cleared" (pending-tasks G-6).
  suspend: true
  schedule: "0 10 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 18000
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nse-fundamentals
              image: local/screener:v16
              imagePullPolicy: Never
              command: ["python", "nse_fundamentals.py"]
              env:
                - name: MAX_MINUTES
                  value: "270"
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-auth
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests: {memory: 128Mi, cpu: 50m}
                limits: {memory: 512Mi, cpu: 500m}
