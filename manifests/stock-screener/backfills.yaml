# One-shot Jobs (Phases D & E bootstrap). Run manually on quiet windows:
#   kubectl apply -f backfills.yaml
# Both are resumable via the job_state cursor — rerun after any interruption.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-stock-prices-max
  namespace: market-data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: prices
          image: local/screener:v26
          imagePullPolicy: Never
          command: ["python", "stock_prices.py"]
          env:
            - name: BACKFILL
              value: "max"
            - name: CHUNK
              value: "50"
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi, cpu: 500m}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-stock-fundamentals
  namespace: market-data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: fundamentals
          image: local/screener:v26
          imagePullPolicy: Never
          command: ["python", "stock_fundamentals.py"]
          env:
            - name: BACKFILL
              value: "1"
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi, cpu: 500m}
---
# DQ-1 (2026-10-18): full dividend/split history -> corporate_actions, then our own adj_close
# for every symbol. Resumable (job_state 'corporate_actions_backfill'); re-runs are safe.
# Rewrites adj_close on ~6.3 M rows in per-symbol transactions — run in a quiet window.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-corporate-actions
  namespace: market-data
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: actions
          image: local/screener:v26
          imagePullPolicy: Never
          command: ["python", "corporate_actions_backfill.py"]
          env:
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi, cpu: 500m}
---
# G-6 (2026-10-18): first full NSE results history (2005 -> today) for the NIFTY 500.
# ~100 filings per company at 1.3 s spacing ≈ 19 h; resumable (job_state 'nse_fundamentals'),
# re-apply to continue. Network-bound, low CPU. Skips filings already stored.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-nse-fundamentals
  namespace: market-data
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: nse-fundamentals
          image: local/screener:v26
          imagePullPolicy: Never
          command: ["python", "nse_fundamentals.py"]
          env:
            - name: MAX_MINUTES
              value: "1380"
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi, cpu: 500m}

---
# Resume of backfill-nse-fundamentals (hit MAX_MINUTES budget before cursor cleared, 2026-10-19).
# Continues from the cursor stored in job_state (idempotent per symbol).
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-nse-fundamentals-resume
  namespace: market-data
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 39600   # 11 h — must cover MAX_MINUTES (the 2.5 h deadline of the first run
  ttlSecondsAfterFinished: 604800  # killed a healthy run with the cursor kept; resume is safe anyway)
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: nse-fundamentals
          image: local/screener:v26
          imagePullPolicy: Never
          command: ["python", "nse_fundamentals.py"]
          env:
            - name: MAX_MINUTES
              value: "630"
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi, cpu: 500m}
