# One-shot deep backfill for the NSE/India indices: everything Yahoo has from
# FETCH_START onward (9 tickers, ~42k rows; Nifty 50 starts 2007-09, Sensex
# 1997-07). Image must be >= v4, which commits one calendar year per transaction.
#   kubectl apply -f backfill-job.yaml
# Idempotent (same DELETE+INSERT as daily runs) — safe to re-run. Delete the
# Job object afterwards to keep history tidy.
# History: 1y at rollout; 5y on 2026-10-10 in ONE transaction (held ~2,900 of the
# database's ~6,400 lock slots for 26 min — the reason the fetcher now commits
# per year); 1985 → today on 2026-10-10 after index_prices moved to one-year
# chunks (schema 01). The Telegram /index card reads 40 years, so an earlier
# FETCH_START adds rows nothing uses.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-nse-deep
  namespace: market-data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: backfill
          image: local/nse-fetcher:v7
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: FETCH_START
              value: "1985-01-01"
            - name: BACKFILL
              value: "1"
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: "1"
---
# One-shot NSE-DIRECT deep backfill (v5, 2026-10-26): ^CNXAUTO + ^CNXFMCG full
# daily OHLC 2015 → today from api/historicalOR/indicesHistory (Yahoo's series
# are dead), plus NIFTYMIDCAP150.NS pre-Yahoo history (close-only early years),
# hard-capped strictly BEFORE 2019-01-14 — Yahoo owns the series from that bar
# on (rule 4). Idempotent; skips the Yahoo leg entirely (NSE_DIRECT_ONLY).
#   kubectl apply -f backfill-job.yaml   (or apply this doc alone)
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-nse-direct
  namespace: market-data
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: backfill
          image: local/nse-fetcher:v7
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: BACKFILL
              value: "1"
            - name: NSE_DIRECT_ONLY
              value: "1"
            - name: NSE_MIDCAP150
              value: "1"
            - name: FETCH_START
              value: "2015-01-01"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
