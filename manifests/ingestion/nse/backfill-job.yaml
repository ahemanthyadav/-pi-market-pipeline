# One-shot 1y backfill for NSE indices. Image must be >= v2
# (FETCH_PERIOD/BACKFILL support); v3 carries ^CRSLDX (Nifty 500), whose
# history only starts 2026-10-09 until this is re-run. Run once:
#   kubectl apply -f backfill-nse.yaml
# Idempotent — safe to re-run. Delete afterwards.
# 2026-10-10: period raised 1y → 5y so the Telegram /index card can show 1/3/5-year
# averages and a low/normal/high reading. Run 2026-10-10 (36,314 + 11,094 rows).
# DO NOT raise it further without changing the fetcher first: this job writes in
# ONE transaction and index_prices has 7-day chunks — the 5y run held ~2,900 of the
# database's ~6,400 lock slots (max_locks_per_transaction 256 x max_connections 25)
# and took 26 min; 10y would need ~6,000 and risks "out of shared memory" for every
# session. Longer history needs a fetcher that commits per time range.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-nse-5y
  namespace: market-data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: backfill
          image: local/nse-fetcher:v3
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: FETCH_PERIOD
              value: 5y
            - name: BACKFILL
              value: "1"
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: "1"
