# Daily NSE/India indices (Phase 3, job #2). 11:15 UTC is after NSE close
# (10:00 UTC / 15:30 IST). Image is node-local (Never pull, on pi1/pi2/pi3).
# Validate changes with:
#   kubectl create job -n market-data nse-test --from=cronjob/nse-fetcher
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nse-fetcher
  namespace: market-data
spec:
  schedule: "15 11 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: fetcher
              image: local/nse-fetcher:v4
              imagePullPolicy: Never
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-auth
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
