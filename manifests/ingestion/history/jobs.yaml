# One-shot history backfills H-1..H-5 (2026-10-19) — script: history_backfill.py (see its header).
# Ship the script, then apply the Jobs you want (each is independent and idempotent; only pre-live dates are written):
#   kubectl -n market-data create configmap history-backfill --from-file=history_backfill.py=manifests/ingestion/history/history_backfill.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f manifests/ingestion/history/jobs.yaml           # or -l via: kubectl apply -f - <<< one document
# Logs end with HISTORY-BACKFILL-OK mode=… rows=…  Delete the Jobs + ConfigMap afterwards (TTL removes Jobs after 7 days).
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-history-fx
  namespace: market-data
  labels: {app: history-backfill, mode: fx}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: backfill
          image: local/fx-fetcher:v1
          imagePullPolicy: Never
          command: ["python", "/scripts/history_backfill.py"]
          env:
            - {name: MODE, value: "fx"}
            - {name: PGHOST, value: timescaledb.market-data.svc.cluster.local}
            - {name: PGUSER, value: postgres}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: timescaledb-auth, key: password}}}
            - {name: PGDATABASE, value: postgres}
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi, cpu: 500m}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: history-backfill}
---
