# One-shot deep backfill for the global batch: everything Yahoo has from
# FETCH_START onward (29 tickers, ~250k rows from 1985). Image must be >= v5,
# which commits one calendar year per transaction.
#   kubectl apply -f backfill-job.yaml
# Idempotent (same DELETE+INSERT as daily runs) — safe to re-run. Delete the
# Job object afterwards to keep history tidy.
# History: 1y at rollout; 5y on 2026-10-10 in ONE transaction (held ~2,900 of the
# database's ~6,400 lock slots for 26 min — the reason the fetcher now commits
# per year); 1985 → today on 2026-10-10 after index_prices moved to one-year
# chunks (schema 01). The Telegram /index card reads 40 years, so an earlier
# FETCH_START adds rows nothing uses.
apiVersion: batch/v1
kind: Job
metadata:
  name: backfill-yfinance-deep
  namespace: market-data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: backfill
          image: local/yfinance-fetcher:v5
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: timescaledb.market-data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-auth
                  key: password
            - name: PGDATABASE
              value: postgres
            - name: FETCH_START
              value: "1985-01-01"
            - name: BACKFILL
              value: "1"
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1Gi
              cpu: "1"
