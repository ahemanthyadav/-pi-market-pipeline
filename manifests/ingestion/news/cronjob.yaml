# Daily market-news staging (Phase 3, job #6). 23:45 UTC — headlines staged here
# are scored by the sentiment job after midnight. Image is node-local
# (Never pull, on pi1/pi2/pi3). Validate with:
#   kubectl create job -n market-data news-test --from=cronjob/news-fetcher
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-fetcher
  namespace: market-data
spec:
  schedule: "45 23 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: fetcher
              image: local/news-fetcher:v1
              imagePullPolicy: Never
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: timescaledb-auth
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 256Mi
                  cpu: 500m
