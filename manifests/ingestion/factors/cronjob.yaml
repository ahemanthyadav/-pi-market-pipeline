# Monthly factor returns (G-20, 2026-10-26): Ken French US 5-factors+MOM and
# the IIM-A India four-factor library into factor_returns. Monthly cadence —
# both libraries update monthly or slower (IIM-A: three releases a year).
# Runs on the 2nd so month-end library updates have landed; idempotent
# DELETE+INSERT per (market, factor, freq, ts), full-history re-read each run
# (the files ARE the full history — restatements land automatically).
# First mdjob adopter (AR-2/AR-3): check job_runs for its run records.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: factors-fetcher
  namespace: market-data
spec:
  schedule: "0 11 2 * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: fetcher
              image: local/marketdata-light:v1
              imagePullPolicy: Never
              command: ["python", "factors-fetcher.py"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: timescaledb.market-data.svc.cluster.local
                - name: PGUSER
                  value: pipeline_rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pipeline-db-rw
                      key: password
                - name: PGDATABASE
                  value: postgres
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 500m
