apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-service
  namespace: market-data
  labels:
    app: stt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt-service
  template:
    metadata:
      labels:
        app: stt-service
    spec:
      restartPolicy: Always
      nodeSelector:
        hardware: orin
      tolerations:
        - key: hardware
          operator: Equal
          value: orin
          effect: NoSchedule
      containers:
        - name: stt
          image: local/stt-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: stt-service
  namespace: market-data
  labels:
    app: stt-service
spec:
  type: ClusterIP
  selector:
    app: stt-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
