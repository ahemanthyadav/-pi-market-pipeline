apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-service
  namespace: market-data
  labels:
    app: tts-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-service
  template:
    metadata:
      labels:
        app: tts-service
    spec:
      restartPolicy: Always
      nodeSelector:
        hardware: orin
      tolerations:
        - key: hardware
          operator: Equal
          value: orin
          effect: NoSchedule
      containers:
        - name: tts
          image: local/tts-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  namespace: market-data
  labels:
    app: tts-service
spec:
  type: ClusterIP
  selector:
    app: tts-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
