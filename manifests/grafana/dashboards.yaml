# Provisioned dashboards (Phase 7). Applied as one ConfigMap mounted into
# /etc/grafana/provisioning/dashboards/ (see provisioning.yaml provider).
# All panels query the TimescaleDB datasource (uid: timescaledb).
# NOTE: $__timeFilter requires a time range to be set in the dashboard UI (top-right).
# All column aliases use double quotes for PostgreSQL compatibility.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: market-data
data:
  overview.json: |-
    {"title":"Market Overview","time":{"from":"now-90d","to":"now"},"uid":"overview","schemaVersion":39,"version":3,"tags":["market-data"],"panels":[{"type":"stat","title":"Nifty 50","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":0,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT close AS \"Nifty 50\" FROM index_prices WHERE ticker = '^NSEI' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"S&P 500","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":4,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT close AS \"S&P 500\" FROM index_prices WHERE ticker = '^GSPC' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"Sensex","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":8,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT close AS \"Sensex\" FROM index_prices WHERE ticker = '^BSESN' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"VIX","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":12,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT close AS \"VIX\" FROM index_prices WHERE ticker = '^VIX' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"India VIX","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":16,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT close AS \"India VIX\" FROM index_prices WHERE ticker = '^INDIAVIX' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"USD/INR","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":20,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT rate AS \"USDINR\" FROM fx_rates WHERE pair = 'USDINR=X' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"gauge","title":"7d avg sentiment","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":6,"w":6,"x":0,"y":4},"targets":[{"refId":"A","format":"table","rawSql":"SELECT AVG(sentiment_score) AS \"sentiment\" FROM news_sentiment WHERE ts > now() - interval '7 days'"}],"fieldConfig":{"defaults":{"min":-1,"max":1,"thresholds":{"mode":"absolute","steps":[{"value":-1,"color":"red"},{"value":-0.2,"color":"yellow"},{"value":0.2,"color":"green"}]},"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"bargauge","title":"Latest FII/DII net (Rs cr)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":6,"w":6,"x":6,"y":4},"targets":[{"refId":"A","format":"table","rawSql":"SELECT flow_type AS \"flow\", amount FROM capital_flows WHERE direction = 'net' AND ts = (SELECT max(ts) FROM capital_flows)"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"gradient","orientation":"horizontal"}}}},{"type":"timeseries","title":"Nifty 50 / S&P 500 / Sensex","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":12,"x":12,"y":4},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"Nifty 50\" FROM index_prices WHERE ticker = '^NSEI' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"S&P 500\" FROM index_prices WHERE ticker = '^GSPC' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"C","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"Sensex\" FROM index_prices WHERE ticker = '^BSESN' AND $__timeFilter(ts) ORDER BY ts"}]},{"type":"timeseries","title":"USD/INR and Gold","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":24,"x":0,"y":12},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", rate AS \"USDINR\" FROM fx_rates WHERE pair = 'USDINR=X' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"Gold fut\" FROM (SELECT ts, close FROM index_prices WHERE ticker = 'GC=F' AND $__timeFilter(ts) UNION ALL SELECT ts, close FROM intraday_prices WHERE ticker = 'GC=F' AND $__timeFilter(ts)) u ORDER BY ts"}]}]}
  indices.json: |-
    {"title":"Indices","time":{"from":"now-90d","to":"now"},"uid":"indices","schemaVersion":39,"version":2,"tags":["market-data"],"templating":{"list":[{"name":"ticker","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT COALESCE(t.name || ' (' || i.ticker || ')', i.ticker) AS __text, i.ticker AS __value FROM (SELECT DISTINCT ticker FROM index_prices) i LEFT JOIN ticker_names t ON t.ticker = i.ticker ORDER BY i.ticker","refresh":1,"includeAll":false,"current":{"text":"Nifty 50 (^NSEI)","value":"^NSEI"}}]},"panels":[{"type":"timeseries","title":"Close: ${ticker:text}","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":16,"x":0,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"close\" FROM index_prices WHERE ticker = '$ticker' AND $__timeFilter(ts) ORDER BY ts"}]},{"type":"timeseries","title":"Volume: ${ticker:text}","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":8,"x":16,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", volume AS \"volume\" FROM index_prices WHERE ticker = '$ticker' AND $__timeFilter(ts) ORDER BY ts"}]},{"type":"timeseries","title":"RSI14 + MACD: ${ticker:text}","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":6,"w":24,"x":0,"y":8},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", value AS \"RSI14\" FROM technical_indicators WHERE ticker = '$ticker' AND indicator_name = 'RSI14' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", value AS \"MACD\" FROM technical_indicators WHERE ticker = '$ticker' AND indicator_name = 'MACD' AND $__timeFilter(ts) ORDER BY ts"}]}]}
  markets.json: |-
    {"title":"FX, Commodities & Yields","time":{"from":"now-90d","to":"now"},"uid":"markets","schemaVersion":39,"version":3,"tags":["market-data"],"panels":[{"type":"timeseries","title":"USD/INR and EUR/USD","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", rate AS \"USDINR\" FROM fx_rates WHERE pair = 'USDINR=X' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", rate AS \"EURUSD\" FROM fx_rates WHERE pair = 'EURUSD=X' AND $__timeFilter(ts) ORDER BY ts"}]},{"type":"timeseries","title":"Gold, Silver, Oil futures","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"Gold\" FROM (SELECT ts, close FROM index_prices WHERE ticker = 'GC=F' AND $__timeFilter(ts) UNION ALL SELECT ts, close FROM intraday_prices WHERE ticker = 'GC=F' AND $__timeFilter(ts)) u ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"Silver\" FROM (SELECT ts, close FROM index_prices WHERE ticker = 'SI=F' AND $__timeFilter(ts) UNION ALL SELECT ts, close FROM intraday_prices WHERE ticker = 'SI=F' AND $__timeFilter(ts)) u ORDER BY ts"},{"refId":"C","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"WTI\" FROM (SELECT ts, close FROM index_prices WHERE ticker = 'CL=F' AND $__timeFilter(ts) UNION ALL SELECT ts, close FROM intraday_prices WHERE ticker = 'CL=F' AND $__timeFilter(ts)) u ORDER BY ts"}]},{"type":"timeseries","title":"US Treasury yields (%)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":24,"x":0,"y":8},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"10Y\" FROM bond_yields WHERE instrument = '^TNX' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"5Y\" FROM bond_yields WHERE instrument = '^FVX' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"C","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"30Y\" FROM bond_yields WHERE instrument = '^TYX' AND $__timeFilter(ts) ORDER BY ts"}]},{"type":"timeseries","title":"India yields (RBI G-Secs, %)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":12,"x":0,"y":16},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"3Y\" FROM bond_yields WHERE instrument = 'IN_GS_3Y' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"5Y\" FROM bond_yields WHERE instrument = 'IN_GS_5Y' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"C","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"10Y\" FROM bond_yields WHERE instrument = 'IN_GS_10Y' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"D","format":"time_series","rawSql":"SELECT ts AS \"time\", yield AS \"30Y\" FROM bond_yields WHERE instrument = 'IN_GS_30Y' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"E","format":"time_series","rawSql":"SELECT ts AS \"time\", value AS \"Repo rate\" FROM interest_rates WHERE rate_name = 'IN_REPO' AND $__timeFilter(ts) ORDER BY ts"}]}]}
  sentiment.json: |-
    {"title":"Sentiment & News","time":{"from":"now-90d","to":"now"},"uid":"sentiment","schemaVersion":39,"version":2,"tags":["market-data"],"panels":[{"type":"timeseries","title":"Daily mean sentiment","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":16,"x":0,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT date_trunc('day', ts) AS \"time\", AVG(sentiment_score) AS \"sentiment\" FROM news_sentiment WHERE $__timeFilter(ts) GROUP BY 1 ORDER BY 1"}]},{"type":"piechart","title":"By relevance","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":8,"x":16,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT ticker_relevance AS \"metric\", COUNT(*) AS \"value\" FROM news_sentiment WHERE $__timeFilter(ts) GROUP BY 1 ORDER BY 2 DESC"}]},{"type":"table","title":"Latest scored headlines","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":24,"x":0,"y":8},"targets":[{"refId":"A","format":"table","rawSql":"SELECT ts AS \"time\", headline AS \"headline\", source AS \"source\", ROUND(sentiment_score::numeric, 3) AS \"score\" FROM news_sentiment ORDER BY ts DESC LIMIT 20"}]}]}
  flows.json: |-
    {"title":"Capital Flows","time":{"from":"now-90d","to":"now"},"uid":"flows","schemaVersion":39,"version":2,"tags":["market-data"],"panels":[{"type":"barchart","title":"FII/DII daily net (Rs cr)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":16,"x":0,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts::date AS \"time\", flow_type AS \"metric\", SUM(amount) AS \"value\" FROM capital_flows WHERE direction = 'net' AND $__timeFilter(ts) GROUP BY 1, 2 ORDER BY 1"}]},{"type":"table","title":"Latest flows","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":8,"x":16,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT ts::date AS \"day\", flow_type AS \"flow\", direction, amount, segment FROM capital_flows ORDER BY ts DESC, flow_type LIMIT 20"}]},{"type":"text","title":"FDI (monthly, manual)","gridPos":{"h":4,"w":24,"x":0,"y":8},"options":{"mode":"markdown","content":"FDI arrives monthly via the fdi-watch job + manual INSERT (see plan Phase 3 job #8). Query: SELECT * FROM capital_flows WHERE flow_type = 'FDI' ORDER BY ts DESC."}}]}
  screener.json: |-
    {"title":"Stock Screener","uid":"screener","schemaVersion":39,"version":1,"tags":["market-data"],"time":{"from":"now-90d","to":"now"},"templating":{"list":[{"name":"universe","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT DISTINCT universe AS __text, universe AS __value FROM universe_constituents WHERE active ORDER BY 1","refresh":1,"includeAll":false,"current":{"text":"NIFTY500","value":"NIFTY500"}}]},"panels":[{"type":"stat","title":"Scored","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":0,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT n_scored AS \"scored\" FROM screening_runs WHERE universe='$universe' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"Eligible","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":4,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT n_eligible AS \"eligible\" FROM screening_runs WHERE universe='$universe' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"Shortlisted","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":8,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT n_shortlisted AS \"shortlisted\" FROM screening_runs WHERE universe='$universe' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"stat","title":"Avg coverage","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":4,"x":12,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT round(avg(coverage)::numeric,2) AS \"avg coverage\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' ORDER BY s.symbol, s.ts DESC) l"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value"}}}},{"type":"text","title":"How to read this","gridPos":{"h":4,"w":8,"x":16,"y":0},"options":{"mode":"markdown","content":"Composite = 0.25 value + 0.25 quality + 0.20 growth + 0.20 momentum + 0.10 risk; factor scores are winsorized (1/99) cross-sectional percentile ranks x100. Eligible = coverage >= 0.60 and 20d dollar volume >= universe p10; ranked among eligible; shortlist = top 25 per universe. Chain: prices 23:30 -> metrics 02:00 -> screener 02:15 -> report 02:30 (node-local PDT). Factor panels: top-10 eligible by each factor. Reports + digest in stock_reports."}},{"type":"table","title":"Top 25 - ${universe}","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":15,"w":16,"x":0,"y":4},"targets":[{"refId":"A","format":"table","rawSql":"SELECT l.rank AS \"rank\", l.symbol AS \"symbol\", coalesce(c.name, l.symbol) AS \"name\", round(l.composite::numeric,1) AS \"composite\", round(l.value_score::numeric,2) AS \"value\", round(l.quality_score::numeric,2) AS \"quality\", round(l.growth_score::numeric,2) AS \"growth\", round(l.momentum_score::numeric,2) AS \"momentum\", round(l.risk_score::numeric,2) AS \"risk\", round(l.coverage::numeric,2) AS \"coverage\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' ORDER BY s.symbol, s.ts DESC) l LEFT JOIN universe_constituents c ON c.symbol=l.symbol AND c.universe=l.universe WHERE l.rank IS NOT NULL AND l.rank <= 25 ORDER BY l.rank"}],"fieldConfig":{"defaults":{"custom":{"align":"auto"}},"overrides":[]},"options":{"showHeader":true}},{"type":"timeseries","title":"Median composite - ${universe}","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":15,"w":8,"x":16,"y":4},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts::date AS \"time\", round((percentile_cont(0.5) WITHIN GROUP (ORDER BY composite))::numeric,1) AS \"median composite\", round((percentile_cont(0.5) WITHIN GROUP (ORDER BY composite) FILTER (WHERE eligible))::numeric,1) AS \"median eligible\" FROM stock_scores WHERE universe='$universe' AND $__timeFilter(ts) GROUP BY 1 ORDER BY 1"}]},{"type":"barchart","title":"Top 10 by value","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":5,"x":0,"y":19},"targets":[{"refId":"A","format":"table","rawSql":"SELECT l.symbol AS \"symbol\", round(l.value_score::numeric,3) AS \"value\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' AND s.eligible ORDER BY s.symbol, s.ts DESC) l ORDER BY 2 DESC LIMIT 10"}],"fieldConfig":{"defaults":{"custom":{"axisPlacement":"auto"}}},"options":{"orientation":"auto","showValue":"auto","stacking":"off","groupWidth":0.7,"barWidth":0.9,"xTickLabelRotation":0,"xTickLabelSpacing":0}},{"type":"barchart","title":"Top 10 by quality","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":5,"x":5,"y":19},"targets":[{"refId":"A","format":"table","rawSql":"SELECT l.symbol AS \"symbol\", round(l.quality_score::numeric,3) AS \"quality\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' AND s.eligible ORDER BY s.symbol, s.ts DESC) l ORDER BY 2 DESC LIMIT 10"}],"fieldConfig":{"defaults":{"custom":{"axisPlacement":"auto"}}},"options":{"orientation":"auto","showValue":"auto","stacking":"off","groupWidth":0.7,"barWidth":0.9,"xTickLabelRotation":0,"xTickLabelSpacing":0}},{"type":"barchart","title":"Top 10 by growth","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":5,"x":10,"y":19},"targets":[{"refId":"A","format":"table","rawSql":"SELECT l.symbol AS \"symbol\", round(l.growth_score::numeric,3) AS \"growth\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' AND s.eligible ORDER BY s.symbol, s.ts DESC) l ORDER BY 2 DESC LIMIT 10"}],"fieldConfig":{"defaults":{"custom":{"axisPlacement":"auto"}}},"options":{"orientation":"auto","showValue":"auto","stacking":"off","groupWidth":0.7,"barWidth":0.9,"xTickLabelRotation":0,"xTickLabelSpacing":0}},{"type":"barchart","title":"Top 10 by momentum","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":5,"x":15,"y":19},"targets":[{"refId":"A","format":"table","rawSql":"SELECT l.symbol AS \"symbol\", round(l.momentum_score::numeric,3) AS \"momentum\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' AND s.eligible ORDER BY s.symbol, s.ts DESC) l ORDER BY 2 DESC LIMIT 10"}],"fieldConfig":{"defaults":{"custom":{"axisPlacement":"auto"}}},"options":{"orientation":"auto","showValue":"auto","stacking":"off","groupWidth":0.7,"barWidth":0.9,"xTickLabelRotation":0,"xTickLabelSpacing":0}},{"type":"barchart","title":"Top 10 by risk","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":4,"x":20,"y":19},"targets":[{"refId":"A","format":"table","rawSql":"SELECT l.symbol AS \"symbol\", round(l.risk_score::numeric,3) AS \"risk\" FROM (SELECT DISTINCT ON (symbol) s.* FROM stock_scores s WHERE s.universe='$universe' AND s.eligible ORDER BY s.symbol, s.ts DESC) l ORDER BY 2 DESC LIMIT 10"}],"fieldConfig":{"defaults":{"custom":{"axisPlacement":"auto"}}},"options":{"orientation":"auto","showValue":"auto","stacking":"off","groupWidth":0.7,"barWidth":0.9,"xTickLabelRotation":0,"xTickLabelSpacing":0}}]}
  derived.json: |-
    {"title":"Derived Metrics","time":{"from":"now-90d","to":"now"},"uid":"derived","schemaVersion":39,"version":1,"tags":["market-data"],"panels":[{"type":"table","title":"World indices — day, 1 month, year to date","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":12,"w":24,"x":0,"y":0},"fieldConfig":{"defaults":{"decimals":2},"overrides":[]},"targets":[{"refId":"A","format":"table","rawSql":"SELECT COALESCE(n.name, t.k) AS \"Index\", l.ts::date AS \"As of\", l.v AS \"Close\", (l.v / d.v - 1) * 100 AS \"Day %\", (l.v / m.v - 1) * 100 AS \"1m %\", (l.v / y.v - 1) * 100 AS \"YTD %\" FROM (SELECT DISTINCT ticker AS k FROM index_prices WHERE ts >= now() - interval '15 days') t INNER JOIN LATERAL (SELECT ts, close AS v FROM index_prices x WHERE x.ticker = t.k AND x.ts >= now() - interval '15 days' ORDER BY x.ts DESC LIMIT 1) l ON true LEFT JOIN LATERAL (SELECT close AS v FROM index_prices x WHERE x.ticker = t.k AND x.ts < date_trunc('day', l.ts) AND x.ts >= date_trunc('day', l.ts) - interval '20 days' ORDER BY x.ts DESC LIMIT 1) d ON true LEFT JOIN LATERAL (SELECT close AS v FROM index_prices x WHERE x.ticker = t.k AND x.ts < l.ts - interval '29 days' AND x.ts >= l.ts - interval '29 days' - interval '20 days' ORDER BY x.ts DESC LIMIT 1) m ON true LEFT JOIN LATERAL (SELECT close AS v FROM index_prices x WHERE x.ticker = t.k AND x.ts < date_trunc('year', l.ts) AND x.ts >= date_trunc('year', l.ts) - interval '20 days' ORDER BY x.ts DESC LIMIT 1) y ON true LEFT JOIN ticker_names n ON n.ticker = t.k ORDER BY 6 DESC NULLS LAST"}]},{"type":"timeseries","title":"Gold in INR per 10 g (international parity, ex-duty)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":12,"x":0,"y":12},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT g.ts AS \"time\", g.close * f.rate / 31.1034768 * 10 AS \"Gold INR per 10g\" FROM index_prices g INNER JOIN LATERAL (SELECT rate FROM fx_rates WHERE pair = 'USDINR=X' AND ts < g.ts + interval '1 day' AND ts >= g.ts - interval '7 days' ORDER BY ts DESC LIMIT 1) f ON true WHERE g.ticker = 'GC=F' AND $__timeFilter(g.ts) ORDER BY g.ts"}]},{"type":"timeseries","title":"Yield spreads (percentage points)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":12,"x":12,"y":12},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT a.ts AS \"time\", a.yield - b.yield AS \"US 10Y-3M\" FROM bond_yields a INNER JOIN bond_yields b ON b.ts::date = a.ts::date AND b.instrument = '^IRX' WHERE a.instrument = '^TNX' AND $__timeFilter(a.ts) ORDER BY a.ts"},{"refId":"B","format":"time_series","rawSql":"SELECT a.ts AS \"time\", a.yield - b.yield AS \"US 30Y-5Y\" FROM bond_yields a INNER JOIN bond_yields b ON b.ts::date = a.ts::date AND b.instrument = '^FVX' WHERE a.instrument = '^TYX' AND $__timeFilter(a.ts) ORDER BY a.ts"},{"refId":"C","format":"time_series","rawSql":"SELECT a.ts AS \"time\", a.yield - b.yield AS \"India 10Y-3Y\" FROM bond_yields a INNER JOIN bond_yields b ON b.ts::date = a.ts::date AND b.instrument = 'IN_GS_3Y' WHERE a.instrument = 'IN_GS_10Y' AND $__timeFilter(a.ts) ORDER BY a.ts"},{"refId":"D","format":"time_series","rawSql":"SELECT a.ts AS \"time\", a.yield - b.yield AS \"India 10Y - US 10Y\" FROM bond_yields a INNER JOIN bond_yields b ON b.ts::date = a.ts::date AND b.instrument = '^TNX' WHERE a.instrument = 'IN_GS_10Y' AND $__timeFilter(a.ts) ORDER BY a.ts"}]},{"type":"timeseries","title":"FII flows vs Nifty","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":24,"x":0,"y":20},"targets":[{"refId":"A","format":"time_series","rawSql":"WITH f AS (SELECT ts::date AS d, SUM(amount) AS fii FROM capital_flows WHERE flow_type = 'FII' AND direction = 'net' GROUP BY 1), n AS (SELECT ts::date AS d, close / LAG(close) OVER (ORDER BY ts) - 1 AS ret FROM index_prices WHERE ticker = '^NSEI'), j AS (SELECT f.d, f.fii, n.ret FROM f INNER JOIN n ON n.d = f.d WHERE n.ret IS NOT NULL) SELECT d::timestamptz AS \"time\", CORR(fii, ret) OVER (ORDER BY d ROWS BETWEEN 19 PRECEDING AND CURRENT ROW) AS \"FII net vs Nifty return, 20-session correlation\" FROM j WHERE $__timeFilter(d::timestamptz) ORDER BY d"}]}]}
  valuation.json: |-
    {"title":"Valuation Explorer","uid":"valuation","schemaVersion":39,"version":1,"tags":["market-data"],"time":{"from":"now-90d","to":"now"},"templating":{"list":[{"name":"symbol","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT COALESCE(name || ' (' || symbol || ')', symbol) AS __text, symbol AS __value FROM universe_constituents WHERE active ORDER BY symbol","refresh":1,"includeAll":false,"current":{"text":"AAPL","value":"AAPL"}},{"name":"universe","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT DISTINCT universe AS __text, universe AS __value FROM universe_constituents WHERE active ORDER BY 1","refresh":1,"includeAll":false,"current":{"text":"SP500","value":"SP500"}}]},"panels":[{"type":"stat","title":"${symbol:text} \u2014 close / fair value / upside / methods","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":12,"x":0,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT round(close::numeric,2) AS \"close\", round(fair_value::numeric,2) AS \"fair value\", round(upside_pct::numeric,1) AS \"upside %\", methods AS \"methods\" FROM stock_valuations WHERE symbol = '$symbol' AND ts >= now() - interval '7 days' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value_and_name"}}}},{"type":"stat","title":"Method coverage (symbols with each method, latest run)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":12,"x":12,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT count(graham) AS \"graham\", count(peer_multiple) AS \"peer\", count(fcf_yield) AS \"fcf\", count(dcf) AS \"dcf\", count(ddm) AS \"ddm\", count(epv) AS \"epv\", count(residual_income) AS \"resid\", count(peg_lynch) AS \"peg\" FROM (SELECT * FROM stock_valuations WHERE ts >= now() - interval '7 days' AND ts = (SELECT max(ts) FROM stock_valuations WHERE ts >= now() - interval '7 days')) v"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value_and_name"}}}},{"type":"barchart","title":"Method panel: ${symbol:text} (ADR 0026 \u2014 not advice)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":12,"x":0,"y":4},"targets":[{"refId":"A","format":"table","rawSql":"SELECT m AS \"method\", v AS \"value\" FROM (SELECT unnest(ARRAY['graham','peer multiple','fcf yield','dcf','ddm','epv','residual income','peg']) AS m, unnest(ARRAY[graham, peer_multiple, fcf_yield, dcf, ddm, epv, residual_income, peg_lynch]) AS v FROM (SELECT * FROM stock_valuations WHERE symbol = '$symbol' AND ts >= now() - interval '7 days' ORDER BY ts DESC LIMIT 1) one) u WHERE v IS NOT NULL"}],"options":{"orientation":"horizontal","showValue":"auto"}},{"type":"timeseries","title":"Fair value vs close: ${symbol:text} (accrues daily)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":12,"x":12,"y":4},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", close AS \"close\" FROM stock_valuations WHERE symbol = '$symbol' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", fair_value AS \"fair value\" FROM stock_valuations WHERE symbol = '$symbol' AND $__timeFilter(ts) ORDER BY ts"}]},{"type":"table","title":"Top 25 upside \u2014 ${universe} (eligible, >=3 methods)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":12,"w":12,"x":0,"y":13},"targets":[{"refId":"A","format":"table","rawSql":"SELECT v.symbol AS \"symbol\", c.name AS \"name\", c.sector AS \"sector\", round(v.close::numeric,1) AS \"close\", round(v.fair_value::numeric,1) AS \"fair\", round(v.upside_pct::numeric,0) AS \"upside %\", v.methods AS \"m\" FROM (SELECT * FROM stock_valuations WHERE ts >= now() - interval '7 days' AND ts = (SELECT max(ts) FROM stock_valuations WHERE ts >= now() - interval '7 days')) v JOIN (SELECT DISTINCT ON (symbol) symbol, eligible FROM stock_scores WHERE universe = '$universe' AND ts >= now() - interval '14 days' ORDER BY symbol, ts DESC) s ON s.symbol = v.symbol AND s.eligible JOIN universe_constituents c ON c.symbol = v.symbol AND c.universe = '$universe' WHERE v.methods >= 3 ORDER BY v.upside_pct DESC LIMIT 25"}]},{"type":"table","title":"Bottom 25 upside \u2014 ${universe} (eligible, >=3 methods)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":12,"w":12,"x":12,"y":13},"targets":[{"refId":"A","format":"table","rawSql":"SELECT v.symbol AS \"symbol\", c.name AS \"name\", c.sector AS \"sector\", round(v.close::numeric,1) AS \"close\", round(v.fair_value::numeric,1) AS \"fair\", round(v.upside_pct::numeric,0) AS \"upside %\", v.methods AS \"m\" FROM (SELECT * FROM stock_valuations WHERE ts >= now() - interval '7 days' AND ts = (SELECT max(ts) FROM stock_valuations WHERE ts >= now() - interval '7 days')) v JOIN (SELECT DISTINCT ON (symbol) symbol, eligible FROM stock_scores WHERE universe = '$universe' AND ts >= now() - interval '14 days' ORDER BY symbol, ts DESC) s ON s.symbol = v.symbol AND s.eligible JOIN universe_constituents c ON c.symbol = v.symbol AND c.universe = '$universe' WHERE v.methods >= 3 ORDER BY v.upside_pct ASC LIMIT 25"}]}]}
  sectors.json: |-
    {"title":"Sector Analysis","uid":"sectors","schemaVersion":39,"version":1,"tags":["market-data"],"time":{"from":"now-90d","to":"now"},"templating":{"list":[{"name":"universe","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT DISTINCT universe AS __text, universe AS __value FROM universe_constituents WHERE active ORDER BY 1","refresh":1,"includeAll":false,"current":{"text":"SP500","value":"SP500"}},{"name":"sector","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT DISTINCT sector AS __text, sector AS __value FROM universe_constituents WHERE universe = '$universe' AND active ORDER BY 1","refresh":1,"includeAll":false,"current":{"text":"Financials","value":"Financials"}}]},"panels":[{"type":"table","title":"Sectors \u2014 ${universe} (latest; ADR 0026)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":11,"w":24,"x":0,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT m.sector AS \"sector\", m.members AS \"n\", round(m.median_pe::numeric,1) AS \"P/E\", round(m.median_pb::numeric,1) AS \"P/B\", round(m.median_ev_ebitda::numeric,1) AS \"EV/EBITDA\", round(m.median_roe::numeric,2) AS \"ROE\", round(m.median_op_margin::numeric,2) AS \"op margin\", round((m.avg_ret_6m*100)::numeric,1) AS \"6m %\", round((m.avg_ret_12m*100)::numeric,1) AS \"12m %\", round(m.median_upside_pct::numeric,0) AS \"upside %\", st.note AS \"lens\" FROM (SELECT * FROM sector_metrics WHERE ts >= now() - interval '7 days' AND ts = (SELECT max(ts) FROM sector_metrics WHERE ts >= now() - interval '7 days')) m LEFT JOIN sector_styles st ON st.sector = m.sector WHERE m.universe = '$universe' ORDER BY m.median_upside_pct DESC NULLS LAST"}]},{"type":"bargauge","title":"Median upside by sector \u2014 ${universe}","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":10,"w":12,"x":0,"y":11},"targets":[{"refId":"A","format":"table","rawSql":"SELECT m.sector AS \"sector\", round(m.median_upside_pct::numeric,0) AS \"upside %\" FROM (SELECT * FROM sector_metrics WHERE ts >= now() - interval '7 days' AND ts = (SELECT max(ts) FROM sector_metrics WHERE ts >= now() - interval '7 days')) m WHERE m.universe = '$universe' AND m.median_upside_pct IS NOT NULL ORDER BY 2 DESC"}],"options":{"displayMode":"gradient","orientation":"horizontal"}},{"type":"table","title":"What matters in ${sector} (3=primary, 0=misleading)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":10,"w":12,"x":12,"y":11},"targets":[{"refId":"A","format":"table","rawSql":"SELECT r.metric AS \"metric\", r.weight AS \"weight\", r.note AS \"why\" FROM metric_relevance r JOIN sector_styles st ON st.style = r.style WHERE st.sector = '$sector' ORDER BY r.weight DESC, r.metric"}]},{"type":"timeseries","title":"Sector medians over time \u2014 ${sector} (${universe})","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":24,"x":0,"y":21},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts AS \"time\", median_pe AS \"P/E\" FROM sector_metrics WHERE universe = '$universe' AND sector = '$sector' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"B","format":"time_series","rawSql":"SELECT ts AS \"time\", median_pb AS \"P/B\" FROM sector_metrics WHERE universe = '$universe' AND sector = '$sector' AND $__timeFilter(ts) ORDER BY ts"},{"refId":"C","format":"time_series","rawSql":"SELECT ts AS \"time\", median_upside_pct AS \"median upside %\" FROM sector_metrics WHERE universe = '$universe' AND sector = '$sector' AND $__timeFilter(ts) ORDER BY ts"}]}]}
  dossier.json: |-
    {"title":"Stock Dossier","uid":"dossier","schemaVersion":39,"version":1,"tags":["market-data"],"time":{"from":"now-5y","to":"now"},"templating":{"list":[{"name":"symbol","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT COALESCE(name || ' (' || symbol || ')', symbol) AS __text, symbol AS __value FROM universe_constituents WHERE active ORDER BY symbol","refresh":1,"includeAll":false,"current":{"text":"AAPL","value":"AAPL"}}]},"panels":[{"type":"stat","title":"${symbol:text} \u2014 valuation (ADR 0026, not advice)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":16,"x":0,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT round(v.close::numeric,2) AS \"close\", round(v.fair_value::numeric,2) AS \"fair value\", round(v.upside_pct::numeric,1) AS \"upside %\", v.methods AS \"methods\", c.sector AS \"sector\" FROM stock_valuations v JOIN universe_constituents c ON c.symbol = v.symbol WHERE v.symbol = '$symbol' AND v.ts >= now() - interval '7 days' ORDER BY v.ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value_and_name"}}}},{"type":"stat","title":"Latest composite","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":4,"w":8,"x":16,"y":0},"targets":[{"refId":"A","format":"table","rawSql":"SELECT round(composite::numeric,1) AS \"composite\", rank AS \"rank\", round(coverage::numeric,2) AS \"coverage\" FROM stock_scores WHERE symbol = '$symbol' AND ts >= now() - interval '14 days' ORDER BY ts DESC LIMIT 1"}],"fieldConfig":{"defaults":{"custom":{"displayMode":"value","textMode":"value_and_name"}}}},{"type":"table","title":"Fundamentals (latest per metric)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":12,"w":8,"x":0,"y":4},"targets":[{"refId":"A","format":"table","rawSql":"SELECT DISTINCT ON (metric) metric AS \"metric\", round(value::numeric,3) AS \"value\", source AS \"source\", ts::date AS \"as of\" FROM stock_fundamentals WHERE symbol = '$symbol' AND ts >= now() - interval '500 days' ORDER BY metric, ts DESC"}]},{"type":"timeseries","title":"Annual statements (financial_facts, point-in-time)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":12,"w":16,"x":8,"y":4},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT period_end::timestamptz AS \"time\", value AS \"revenue\" FROM (SELECT DISTINCT ON (period_end) period_end, value FROM financial_facts WHERE symbol = '$symbol' AND metric = 'total_revenue' AND duration_days BETWEEN 300 AND 400 ORDER BY period_end, filed DESC) u ORDER BY 1"},{"refId":"B","format":"time_series","rawSql":"SELECT period_end::timestamptz AS \"time\", value AS \"net income\" FROM (SELECT DISTINCT ON (period_end) period_end, value FROM financial_facts WHERE symbol = '$symbol' AND metric = 'net_income' AND duration_days BETWEEN 300 AND 400 ORDER BY period_end, filed DESC) u ORDER BY 1"},{"refId":"C","format":"time_series","rawSql":"SELECT period_end::timestamptz AS \"time\", value AS \"total assets\" FROM (SELECT DISTINCT ON (period_end) period_end, value FROM financial_facts WHERE symbol = '$symbol' AND metric = 'total_assets' AND duration_days = 0 ORDER BY period_end, filed DESC) u ORDER BY 1"}]},{"type":"table","title":"Index membership (EV-1, point-in-time)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":8,"x":0,"y":16},"targets":[{"refId":"A","format":"table","rawSql":"SELECT universe AS \"universe\", added AS \"added\", COALESCE(removed::text,'(current)') AS \"removed\", source AS \"source\" FROM index_membership WHERE symbol = '$symbol' ORDER BY added"}]},{"type":"table","title":"Recent headlines (FinBERT)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":8,"w":16,"x":8,"y":16},"targets":[{"refId":"A","format":"table","rawSql":"SELECT ts AS \"time\", round(sentiment_score::numeric,2) AS \"score\", headline AS \"headline\", source AS \"source\" FROM news_sentiment WHERE ts >= now() - interval '14 days' AND (headline ILIKE '%' || replace(replace('$symbol','.NS',''),'-','.') || '%' OR ticker_relevance ILIKE '%' || replace(replace('$symbol','.NS',''),'-','.') || '%') ORDER BY ts DESC LIMIT 15"}]}]}
  factors.json: |-
    {"title":"Factor Returns","uid":"factors","schemaVersion":39,"version":1,"tags":["market-data"],"time":{"from":"now-10y","to":"now"},"templating":{"list":[{"name":"market","type":"query","datasource":{"type":"postgres","uid":"timescaledb"},"query":"SELECT DISTINCT market AS __text, market AS __value FROM factor_returns ORDER BY 1","refresh":1,"includeAll":false,"current":{"text":"US","value":"US"}}]},"panels":[{"type":"timeseries","title":"Cumulative factor returns \u2014 ${market} (G-20; monthly, compounded)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":11,"w":24,"x":0,"y":0},"targets":[{"refId":"A","format":"time_series","rawSql":"SELECT ts::timestamptz AS \"time\", factor AS \"metric\", exp(sum(ln(1 + value/100.0)) OVER (PARTITION BY factor ORDER BY ts)) - 1 AS \"value\" FROM factor_returns WHERE market = '$market' AND freq = 'M' AND factor <> 'RF' AND $__timeFilter(ts::timestamptz) ORDER BY ts"}]},{"type":"barchart","title":"Latest month \u2014 ${market} (%)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":12,"x":0,"y":11},"targets":[{"refId":"A","format":"table","rawSql":"SELECT factor AS \"factor\", value AS \"%\" FROM factor_returns WHERE market = '$market' AND freq = 'M' AND ts = (SELECT max(ts) FROM factor_returns WHERE market = '$market' AND freq = 'M')"}],"options":{"orientation":"horizontal","showValue":"auto"}},{"type":"table","title":"12-month factor returns \u2014 ${market} (%, compounded)","datasource":{"type":"postgres","uid":"timescaledb"},"gridPos":{"h":9,"w":12,"x":12,"y":11},"targets":[{"refId":"A","format":"table","rawSql":"SELECT factor AS \"factor\", round(((exp(sum(ln(1 + value/100.0))) - 1) * 100)::numeric, 1) AS \"12m %\" FROM factor_returns WHERE market = '$market' AND freq = 'M' AND ts >= (SELECT max(ts) FROM factor_returns WHERE market = '$market' AND freq = 'M') - interval '12 months' GROUP BY factor ORDER BY 2 DESC"}]}]}
